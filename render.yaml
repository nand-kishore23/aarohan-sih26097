services:
  - type: web
    name: aarohan-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        value: https://aarohan-sih26097.vercel.app
